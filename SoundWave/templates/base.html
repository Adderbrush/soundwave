<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <!--Links bootstrap allowing me to use the extra formatting tools-->
    <link rel="stylesheet" href="\static\main.css" />
    <!--Links the CSS document importing stylesheet-->
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-zxzxzxzxzxzxApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="zxzxzxzxzxzxzxsha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <!--Script for the bootstrap javascript modules-->
  </head>
  <main>
    <div class="top">
      <a href="/conversations">
        <!--Allows the logo wrapped by the a class to act as a link to the homescreen-->
        <img
          class="logo"
          src="\static\assets\images\soundwavelogo.png"
          alt="Soundwave Logo"
      /><!--Loads an image (soundwave logo) at top--></a>
      <div class="tag">Learn To Listen</div>
    </div>
    {% block content %}
    <!--This is used so I can make general formatting expanding a base template, and have the body within this block--> 
    {% endblock %}
  </main>
</html>
