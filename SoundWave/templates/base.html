<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoundWave</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
  </head>
  <body>
    <header class="top">
      <a href="{{ url_for('social.conversations') if session.get('userid') else url_for('auth.login') }}">
        <img
          class="logo"
          src="{{ url_for('static', filename='assets/images/soundwavelogo.png') }}"
          alt="SoundWave"
        />
      </a>
      <div class="tag">Learn To Listen</div>
      {% if session.get('userid') %}
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ url_for('social.conversations') }}">Conversations</a>
        <a href="{{ url_for('social.profile', ppt2=session['userid']) }}">Profile</a>
        {% if spotify_enabled %}
        <a href="{{ url_for('auth.verify') }}">Connect Spotify</a>
        {% endif %}
        <a href="{{ url_for('auth.logout') }}">Log out</a>
      </nav>
      {% endif %}
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
