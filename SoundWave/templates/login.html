{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>Welcome back</h1>
  <p>Sign in to continue to SoundWave.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" placeholder="Enter username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <button type="submit" class="btn primary-action">Log in</button>
  </form>
  {% if not spotify_enabled %}
  <p class="muted">Spotify setup is not required to use SoundWave.</p>
  {% endif %}
  <a class="secondary-action" href="{{ url_for('auth.createaccount') }}">Create an account</a>
</section>
{% endblock %}
